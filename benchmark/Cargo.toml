[package]
name = "beam-benchmark"
version = { workspace = true }
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
anyhow = "1"
beam-lib = { workspace = true, features = ["http-util"] }
clap = { workspace = true }
futures = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

